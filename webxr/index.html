<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HYBRID-ARX | Adaptive XR Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        background: #0f0f0f;
        font-family: Arial, sans-serif;
        color: white;
        overflow: hidden;
    }

    header {
        text-align: center;
        padding: 15px;
        font-size: 20px;
        font-weight: bold;
        color: #00ccff;
        background: #1a1a1a;
        border-bottom: 1px solid #333;
        letter-spacing: 1px;
    }

    #viewer {
        width: 100vw;
        height: calc(100vh - 60px);
    }
</style>
</head>

<body>

<header>
HYBRID-ARX | Adaptive XR Viewer
</header>

<div id="viewer"></div>

<!-- IMPORT MAP (CRITICAL) -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRButton } from 'three/addons/webxr/VRButton.js';

/* ===============================
   SCENE SETUP
================================ */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f0f0f);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);
camera.position.set(0, 1.5, 3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight - 60);
renderer.xr.enabled = true;
renderer.setPixelRatio(window.devicePixelRatio);

document.getElementById("viewer").appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

/* ===============================
   CONTROLS
================================ */

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.enableDamping = true;
controls.update();

/* ===============================
   LIGHTING
================================ */

const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
hemiLight.position.set(0, 20, 0);
scene.add(hemiLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(3, 10, 10);
scene.add(dirLight);

/* ===============================
   LOAD GLB MODEL
================================ */

const loader = new GLTFLoader();

loader.load(
    'assets/model.glb',   // Ensure this file exists
    (gltf) => {

        const model = gltf.scene;

        // Fix orientation (COLMAP is Z-up)
        model.rotation.x = -Math.PI / 2;

        model.position.set(0, 0, 0);

        // Adjust scale if needed
        model.scale.set(1, 1, 1);

        scene.add(model);
    },
    undefined,
    (error) => {
        console.error("Error loading GLB:", error);
    }
);

/* ===============================
   RENDER LOOP
================================ */

renderer.setAnimationLoop(() => {
    controls.update();
    renderer.render(scene, camera);
});

/* ===============================
   RESIZE HANDLING
================================ */

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight - 60);
});

</script>

</body>
</html>
